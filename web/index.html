<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>BiliDown - 哔哩哔哩视频在线解析下载</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        bili: '#00aeec',
                        biliPink: '#fb7299',
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #00aeec 0%, #2563eb 50%, #fb7299 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-sky-50/30 to-indigo-50/40 min-h-screen text-slate-800 flex flex-col items-center">

    <!-- 顶部导航 -->
    <header class="w-full max-w-5xl px-6 py-5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-bili to-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30 font-bold text-xl">
                <i class="fa-solid fa-play"></i>
            </div>
            <div>
                <span class="text-xl font-bold tracking-tight text-slate-900">BiliDown</span>
                <span class="ml-1.5 text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-semibold">Web UI</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="toggleSettingsModal()" class="text-slate-600 hover:text-blue-600 p-2 rounded-lg hover:bg-white/80 transition" title="下载设置">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            <a href="https://github.com/misaka-maples/BBDown" target="_blank" class="flex items-center gap-2 text-sm text-slate-600 hover:text-slate-900 bg-white/80 px-3.5 py-1.5 rounded-full border border-slate-200/80 shadow-sm transition">
                <i class="fa-brands fa-github text-base"></i>
                <span class="font-medium">GitHub</span>
            </a>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="w-full max-w-4xl px-4 mt-8 flex flex-col items-center flex-1">
        <!-- 标语 -->
        <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-center text-slate-900 leading-tight">
            哔哩哔哩视频 <span class="gradient-text">高清解析与下载</span>
        </h1>
        <p class="text-slate-500 mt-3 text-center text-sm sm:text-base max-w-xl">
            支持一键提取最高 4K / 1080P60 原画视频与 Hi-Res 音频，无需繁琐命令，秒速直连下载。
        </p>

        <!-- 类似 SnapAny 居中输入框 -->
        <div class="w-full mt-8 glass-card p-2 sm:p-2.5 rounded-2xl shadow-xl shadow-slate-200/60 transition-all focus-within:ring-2 focus-within:ring-blue-500/30">
            <div class="flex items-center gap-2">
                <div class="pl-3 text-slate-400">
                    <i class="fa-solid fa-link text-lg"></i>
                </div>
                <input id="urlInput" type="text" 
                    placeholder="粘贴 B 站视频链接，例如 https://www.bilibili.com/video/BV1... 或 b23.tv 短链" 
                    class="w-full py-3 px-2 bg-transparent text-slate-800 placeholder-slate-400 outline-none text-base font-normal">
                <button onclick="pasteClipboard()" class="hidden sm:flex items-center gap-1.5 px-3 py-2 text-xs font-medium text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg transition" title="粘贴剪贴板">
                    <i class="fa-regular fa-paste"></i>
                    <span>粘贴</span>
                </button>
                <button id="parseBtn" onclick="parseVideo()" class="bg-gradient-to-r from-bili to-blue-600 hover:from-sky-500 hover:to-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center gap-2 whitespace-nowrap">
                    <span id="btnText">解析视频</span>
                    <i id="btnIcon" class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </div>
        </div>

        <!-- 快捷选项提示 -->
        <div class="flex items-center justify-center gap-4 mt-3 text-xs text-slate-500">
            <span class="flex items-center gap-1"><i class="fa-solid fa-bolt text-amber-500"></i> TV 接口免 412 风控</span>
            <span class="flex items-center gap-1"><i class="fa-solid fa-film text-blue-500"></i> 自动混流 MP4</span>
            <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved text-emerald-500"></i> 本地直接驱动</span>
        </div>

        <!-- 默认保存路径指示栏 -->
        <div class="mt-4 flex items-center justify-between w-full px-4 py-2.5 bg-blue-50/80 border border-blue-100 rounded-xl text-xs text-slate-600">
            <span class="flex items-center gap-1.5 font-medium truncate">
                <i class="fa-regular fa-folder-open text-blue-600 text-sm"></i>
                <span>默认下载保存路径：</span>
                <span id="displaySaveDir" class="font-mono text-blue-700 bg-white px-2 py-0.5 rounded border border-blue-200">/home/maple/Downloads</span>
            </span>
            <button onclick="toggleSettingsModal()" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1 transition whitespace-nowrap ml-2">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>修改</span>
            </button>
        </div>

        <!-- 加载中动画 -->
        <div id="loading" class="hidden mt-10 flex flex-col items-center gap-3">
            <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-slate-500">正在解析视频流与清晰度列表...</p>
        </div>

        <!-- 解析结果卡片 -->
        <div id="resultCard" class="hidden w-full mt-8 glass-card p-5 sm:p-7 rounded-2xl shadow-xl shadow-slate-200/50 flex flex-col md:flex-row gap-6">
            <!-- 封面预览图 -->
            <div class="relative w-full md:w-72 h-44 rounded-xl overflow-hidden bg-slate-100 flex-shrink-0 shadow-md">
                <img id="videoCover" src="" class="w-full h-full object-cover">
                <span id="videoDuration" class="absolute bottom-2 right-2 bg-black/75 backdrop-blur-sm text-white text-xs px-2 py-0.5 rounded font-mono font-medium"></span>
            </div>

            <!-- 视频详情与画质选择 -->
            <div class="flex-1 flex flex-col justify-between">
                <div>
                    <h2 id="videoTitle" class="text-lg sm:text-xl font-bold text-slate-900 leading-snug line-clamp-2"></h2>
                    <div class="flex items-center gap-4 mt-2 text-xs text-slate-500">
                        <span id="videoAuthor" class="flex items-center gap-1 text-slate-700 font-medium">
                            <i class="fa-regular fa-user text-blue-500"></i>
                            <span id="authorName"></span>
                        </span>
                        <span id="videoBvid" class="bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-mono"></span>
                    </div>
                </div>

                <!-- 清晰度与下载按钮 -->
                <div class="mt-5 pt-4 border-t border-slate-100">
                    <label class="text-xs font-semibold text-slate-500 block mb-2">选择下载画质：</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
                        <button onclick="selectQuality(this, '4K 超高清, 1080P 高码率, 1080P 高清')" class="quality-btn active px-3 py-2 text-xs rounded-xl border border-blue-500 bg-blue-50 text-blue-700 font-medium transition text-center">
                            4K / 1080P 原画
                        </button>
                        <button onclick="selectQuality(this, '720P 高清')" class="quality-btn px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium transition text-center">
                            720P 高清
                        </button>
                        <button onclick="selectQuality(this, '480P 清晰')" class="quality-btn px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium transition text-center">
                            480P 标清
                        </button>
                        <button onclick="selectQuality(this, 'audio-only')" class="quality-btn px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium transition text-center">
                            仅下载音频 (M4A)
                        </button>
                    </div>

                    <button onclick="submitDownloadTask()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-down"></i>
                        <span>开始高速下载并混流</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 任务列表区域 -->
        <div class="w-full mt-10">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-500"></i>
                    <span>下载任务列表</span>
                </h3>
                <button onclick="refreshTasks()" class="text-xs text-slate-500 hover:text-blue-600 flex items-center gap-1 transition">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>刷新</span>
                </button>
            </div>

            <div id="taskList" class="space-y-3">
                <div id="emptyTaskNotice" class="text-center py-10 bg-white/60 border border-dashed border-slate-200 rounded-2xl text-slate-400 text-xs">
                    暂无正在进行或已完成的任务
                </div>
            </div>
        </div>
    </main>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h4 class="font-bold text-slate-800 text-base">下载与解析配置</h4>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-4 mt-4">
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block">BBDown 服务器地址</label>
                    <input id="settingServerUrl" type="text" value="http://127.0.0.1:58682" class="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block">保存目录 (默认服务器 Videos 目录)</label>
                    <input id="settingSaveDir" type="text" placeholder="/home/maple/Videos" class="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block">自定义 SESSDATA (用于 1080P/4K 大会员权限)</label>
                    <input id="settingCookie" type="password" placeholder="可在此填入浏览器的 SESSDATA" class="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-500">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <span class="text-xs font-medium text-slate-700">启用 TV 模式 (推荐，防 412 拦截)</span>
                    <input id="settingTvMode" type="checkbox" checked class="w-4 h-4 text-blue-600 rounded">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-medium transition">保存配置</button>
            </div>
        </div>
    </div>

    <!-- 底部版权 -->
    <footer class="w-full max-w-5xl py-8 text-center text-xs text-slate-400">
        © 2026 BiliDown Web UI · Powered by BBDown & nilaoda
    </footer>

    <script>
        let selectedQuality = "4K 超高清, 1080P 高码率, 1080P 高清";
        let currentVideoData = null;

        // 本地配置读取与保存
        function getSettings() {
            return {
                serverUrl: localStorage.getItem("bbdown_server_url") || "http://127.0.0.1:58682",
                saveDir: localStorage.getItem("bbdown_save_dir") || "/home/maple/Downloads",
                cookie: localStorage.getItem("bbdown_cookie") || "",
                tvMode: localStorage.getItem("bbdown_tv_mode") !== "false"
            };
        }

        function updateSaveDirDisplay() {
            const s = getSettings();
            const el = document.getElementById("displaySaveDir");
            if (el) el.innerText = s.saveDir;
        }

        function saveSettings() {
            localStorage.setItem("bbdown_server_url", document.getElementById("settingServerUrl").value.trim());
            localStorage.setItem("bbdown_save_dir", document.getElementById("settingSaveDir").value.trim() || "/home/maple/Downloads");
            localStorage.setItem("bbdown_cookie", document.getElementById("settingCookie").value.trim());
            localStorage.setItem("bbdown_tv_mode", document.getElementById("settingTvMode").checked);
            updateSaveDirDisplay();
            toggleSettingsModal();
            alert("配置已保存！");
        }

        function toggleSettingsModal() {
            const modal = document.getElementById("settingsModal");
            modal.classList.toggle("hidden");
            const s = getSettings();
            document.getElementById("settingServerUrl").value = s.serverUrl;
            document.getElementById("settingSaveDir").value = s.saveDir;
            document.getElementById("settingCookie").value = s.cookie;
            document.getElementById("settingTvMode").checked = s.tvMode;
        }

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById("urlInput").value = text;
            } catch (e) {
                alert("无法访问剪贴板，请手动粘贴");
            }
        }

        function selectQuality(btn, q) {
            document.querySelectorAll(".quality-btn").forEach(b => {
                b.className = "quality-btn px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium transition text-center";
            });
            btn.className = "quality-btn active px-3 py-2 text-xs rounded-xl border border-blue-500 bg-blue-50 text-blue-700 font-semibold transition text-center";
            selectedQuality = q;
        }

        // 解析视频元数据 (通过本地 /api/parse 解决 CORS 跨域)
        async function parseVideo() {
            const rawUrl = document.getElementById("urlInput").value.trim();
            if (!rawUrl) return alert("请输入视频链接！");

            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("resultCard").classList.add("hidden");

            try {
                // 本地代理请求，避免浏览器直接请求 B 站报 NetworkError CORS 错误
                const res = await fetch(`/api/parse?url=${encodeURIComponent(rawUrl)}`);
                const data = await res.json();
                if (data.code !== 0) throw new Error(data.message || "B 站接口返回错误");

                const v = data.data;
                currentVideoData = {
                    url: rawUrl,
                    title: v.title,
                    pic: v.pic,
                    bvid: v.bvid,
                    aid: v.aid,
                    duration: formatDuration(v.duration),
                    owner: v.owner
                };

                document.getElementById("videoTitle").innerText = v.title;
                document.getElementById("authorName").innerText = v.owner;
                document.getElementById("videoBvid").innerText = v.bvid;
                document.getElementById("videoDuration").innerText = currentVideoData.duration;
                document.getElementById("videoCover").src = v.pic;
                document.getElementById("resultCard").classList.remove("hidden");
            } catch (err) {
                alert("解析提示: " + err.message + "\n可以直接点击下载，由后台直接解析下载。");
                currentVideoData = { url: rawUrl, title: rawUrl, pic: "", bvid: rawUrl, owner: "未知" };
                document.getElementById("resultCard").classList.remove("hidden");
            } finally {
                document.getElementById("loading").classList.add("hidden");
            }
        }

        function formatDuration(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // 发送下载任务给 BBDown Api Server
        async function submitDownloadTask() {
            if (!currentVideoData) return alert("请先解析视频！");
            const s = getSettings();
            
            const payload = {
                Url: currentVideoData.url,
                UseTvApi: s.tvMode,
                UserAgent: "curl/8.5.0",
                DfnPriority: selectedQuality === "audio-only" ? null : selectedQuality,
                AudioOnly: selectedQuality === "audio-only",
                WorkDir: s.saveDir || "/home/maple/Downloads"
            };

            if (s.cookie) payload.Cookie = `SESSDATA=${s.cookie}`;

            try {
                const res = await fetch(`${s.serverUrl}/add-task`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(await res.text());
                alert("已成功添加至下载队列！\n下载将保存至: " + payload.WorkDir);
                refreshTasks();
            } catch (e) {
                alert("连接 BBDown 服务失败: " + e.message + "\n请确保已在终端执行: BBDown serve");
            }
        }

        // 定时轮询任务状态
        async function refreshTasks() {
            const s = getSettings();
            try {
                const res = await fetch(`${s.serverUrl}/get-tasks/`);
                if (!res.ok) return;
                const data = await res.json();
                renderTaskList(data.Running || [], data.Finished || []);
            } catch (e) {
                console.log("轮询任务列表状态失败:", e);
            }
        }

        function renderTaskList(running, finished) {
            const listDiv = document.getElementById("taskList");
            const notice = document.getElementById("emptyTaskNotice");

            if (running.length === 0 && finished.length === 0) {
                if (notice) notice.classList.remove("hidden");
                return;
            }
            if (notice) notice.classList.add("hidden");

            let html = "";

            // 渲染正在运行的任务
            running.forEach(t => {
                const speedMB = (t.DownloadSpeed / (1024 * 1024)).toFixed(2);
                const percent = Math.round((t.Progress || 0) * 100);
                html += `
                <div class="glass-card p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-2">
                    <div class="flex justify-between items-center text-sm font-semibold text-slate-800">
                        <span class="truncate max-w-md">${t.Title || t.Url}</span>
                        <span class="text-blue-600 text-xs font-mono bg-blue-50 px-2 py-0.5 rounded">${speedMB} MB/s</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                        <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>正在下载混流中...</span>
                        <span>${percent}%</span>
                    </div>
                </div>`;
            });

            // 渲染已完成的任务
            finished.forEach(t => {
                html += `
                <div class="bg-white/80 p-3.5 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-3 truncate max-w-lg">
                        <div class="w-7 h-7 rounded-lg ${t.IsSuccessful ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'} flex items-center justify-center text-xs flex-shrink-0">
                            <i class="fa-solid ${t.IsSuccessful ? 'fa-check' : 'fa-xmark'}"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-800 truncate">${t.Title || t.Url}</span>
                    </div>
                    <span class="text-xs px-2.5 py-1 rounded-full font-medium ${t.IsSuccessful ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">
                        ${t.IsSuccessful ? '已完成' : '失败'}
                    </span>
                </div>`;
            });

            listDiv.innerHTML = html;
        }

        // 页面初始化
        updateSaveDirDisplay();
        setInterval(refreshTasks, 3000);
        refreshTasks();
    </script>
</body>
</html>
